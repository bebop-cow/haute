<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haute Sewing School</title>
<meta name="description" content="A free, hands-on game that teaches you to sew — from threading a needle to finishing your own dress.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9e7e3; --ink:#1d2027; --muted:#6b6e76; --coral:#d9665a; --coral-soft:rgba(217,102,90,.13);
  --card:rgba(255,255,255,.74); --line:rgba(29,32,39,.1); --ok:#3f9b6b;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;display:block;touch-action:none;cursor:default}
#hud{position:fixed;left:0;right:0;top:0;padding:14px 16px 0;pointer-events:none;z-index:2}
#hud .wrap{max-width:720px;margin:0 auto}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.pill{pointer-events:auto;border:0;background:rgba(255,255,255,.6);color:var(--ink);font:500 13px/1 inherit;font-family:inherit;padding:9px 13px;border-radius:999px;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 1px 3px rgba(0,0,0,.06);transition:background .15s}
.pill:hover{background:#fff}
.pill.icon{width:34px;height:34px;padding:0;display:grid;place-items:center}
#dots{display:flex;gap:4px;pointer-events:auto}
#dots i{width:14px;height:5px;border-radius:3px;background:rgba(29,32,39,.12);display:block}
#dots i.done{background:var(--coral)}
#dots i.cur{background:var(--ink)}
#kicker{margin:16px 0 4px;font-size:13px;font-weight:500;color:var(--muted)}
#kicker b{color:var(--ink);font-weight:600}
h1{margin:0;font-size:clamp(24px,4.4vw,36px);line-height:1.08;letter-spacing:-.025em;font-weight:700}
h1 em{font-style:normal;color:var(--coral);background:var(--coral-soft);border-radius:7px;padding:0 .14em;margin:0 -.04em}
#panel{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:var(--card);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-radius:20px;padding:13px;z-index:2;box-shadow:0 10px 30px rgba(40,30,20,.09),0 1px 0 rgba(255,255,255,.9) inset}
#msg{margin:2px 4px 11px;font-size:14px;line-height:1.45;color:#474a52}
#msg b{color:var(--ink);font-weight:600}
#extra{margin:0 2px 10px}
.btns{display:flex;gap:8px}
.btns button{flex:1;height:46px;border-radius:14px;border:0;font:600 15px inherit;font-family:inherit;cursor:pointer;transition:transform .08s,opacity .2s,background .2s}
.btns button:active{transform:scale(.98)}
#b1{background:var(--coral);color:#fff;box-shadow:0 6px 14px rgba(217,102,90,.28)}
#b1:disabled{background:rgba(29,32,39,.1);color:rgba(29,32,39,.38);box-shadow:none;cursor:default}
#b2{background:transparent;color:var(--ink);border:1px solid var(--line);flex:.55}
button[hidden]{display:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:3px solid #fff;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15);position:relative}
.sw.on{outline:2px solid var(--ink);outline-offset:1px}
.swlabel{font-size:12.5px;color:var(--muted);margin-top:6px}
#modal{position:fixed;inset:0;background:rgba(233,231,227,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;z-index:5;padding:16px}
#modal[hidden]{display:none}
#modal .card{background:#fbfaf8;border-radius:22px;max-width:520px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:22px;box-shadow:0 20px 50px rgba(40,30,20,.18)}
#modal h2{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}
#modal h3{margin:18px 0 6px;font-size:15px}
#modal p,#modal li{font-size:14px;line-height:1.5;color:#474a52}
#modal ol,#modal ul{padding-left:20px;margin:6px 0}
#modal .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
#modal label{font-size:12.5px;color:var(--muted);display:block}
#modal input[type=number]{width:100%;font:600 17px inherit;font-family:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;margin-top:4px}
#modal .seg{display:inline-flex;background:rgba(29,32,39,.07);border-radius:10px;padding:3px}
#modal .seg button{border:0;background:transparent;font:600 13px inherit;font-family:inherit;padding:6px 12px;border-radius:8px;cursor:pointer}
#modal .seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
#modal .actions{display:flex;gap:8px;margin-top:16px}
#modal .actions button{flex:1;height:44px;border-radius:13px;border:1px solid var(--line);background:transparent;font:600 14.5px inherit;font-family:inherit;cursor:pointer}
#modal .actions button.primary{background:var(--coral);color:#fff;border:0}
#modal table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
#modal td{padding:7px 4px;border-bottom:1px solid var(--line)}
#modal td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--coral);background:var(--coral-soft);padding:3px 8px;border-radius:99px;margin-bottom:8px}
.irl{font-size:13px;line-height:1.45;color:#474a52;background:rgba(63,155,107,.1);border-radius:12px;padding:9px 11px}
.irl b{color:#2f7d55}
#modal .actions{flex-wrap:wrap}
#modal .actions .wide{flex-basis:100%}
#modal .note{font-size:12.5px;color:var(--muted)}
#pp{display:none}
.ppage{position:relative;overflow:hidden;background:#fff;page-break-after:always;break-after:page}
.pfoot{position:absolute;left:1cm;bottom:.32cm;font:7.5pt Arial,sans-serif;color:#888}
@media (max-width:520px){#kicker{margin-top:12px}#msg{font-size:13.5px}}
@media print{
  html,body{background:#fff;overflow:visible!important;height:auto!important}
  body.pp>*:not(#pp){display:none!important}
  body.pp #pp{display:block}
  canvas,#hud,#panel{display:none!important}
  #modal{position:static;background:none;backdrop-filter:none;display:block;padding:0}
  #modal .card{box-shadow:none;max-height:none;max-width:none}
  #modal .actions{display:none}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header id="hud"><div class="wrap">
  <div class="row">
    <button class="pill" id="back">← Chapters</button>
    <div class="spacer"></div>
    <div id="dots"></div>
    <button class="pill icon" id="snd" title="Sound" aria-label="Toggle sound"></button>
  </div>
  <div id="kicker"></div>
  <h1 id="title"></h1>
</div></header>
<section id="panel">
  <p id="msg"></p>
  <div id="extra" hidden></div>
  <div class="btns"><button id="b2"></button><button id="b1"></button></div>
</section>
<div id="modal" hidden></div>
<div id="pp"></div>
<style id="ppstyle"></style>

<script>
(()=>{
'use strict';
// ───────────────────────── constants & state
const W=1000,H=640;
const CORAL='#d9665a', INK='#1d2027', THREAD='#c2338f', TAPE='#f0c445', BG='#e9e7e3';
const DEF={done:{},m:{bust:92,waist:76,hip:100,length:95,arm:60,outseam:104},fab:{},cuts:{},sound:true};
let state=load();
function load(){let s=null;try{s=JSON.parse(localStorage.getItem('haute.v2'));}catch(e){}
  if(!s){try{const o=JSON.parse(localStorage.getItem('haute.v1'));if(o){s={done:{},m:o.m,fab:{},cuts:{},sound:o.sound};for(const k in(o.done||{})){const i=+k;s.done[i<4?'b'+i:'shift.'+(i-4)]=true;}if(o.fabric)s.fab.shift=o.fabric;if(o.piece)s.cuts['shift.front']=o.piece;}}catch(e){}}
  s=s||{};const d=JSON.parse(JSON.stringify(DEF));return{...d,...s,m:{...d.m,...(s.m||{})},done:s.done||{},fab:s.fab||{},cuts:s.cuts||{}};}
function save(){try{localStorage.setItem('haute.v2',JSON.stringify(state));}catch(e){}}

// ───────────────────────── dom
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const hud=$('hud'),panel=$('panel'),$kicker=$('kicker'),$title=$('title'),$msg=$('msg'),$extra=$('extra'),$b1=$('b1'),$b2=$('b2'),$modal=$('modal'),$dots=$('dots'),$snd=$('snd');
let DPR=1,cw=0,ch=0;const view={s:1,ox:0,oy:0};
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);cw=innerWidth;ch=innerHeight;cv.width=Math.round(cw*DPR);cv.height=Math.round(ch*DPR);cv.style.width=cw+'px';cv.style.height=ch+'px';}
let cam=null,portrait=false,stageAR=1;
function layoutStage(snap){const top=hud.getBoundingClientRect().bottom+4;const bot=panel.getBoundingClientRect().top-4;const ah=Math.max(160,bot-top),aw=cw-24;portrait=aw/ah<1;stageAR=ah/aw;const b=(typeof scene!=='undefined'&&scene&&scene.bounds&&scene.bounds())||{x:0,y:0,w:W,h:H};if(!cam||snap||b.snap)cam={...b};else for(const k of['x','y','w','h'])cam[k]=lerp(cam[k],b[k],.12);const s=Math.min(aw/cam.w,ah/cam.h);view.s=s;view.ox=(cw-cam.w*s)/2-cam.x*s;view.oy=top+(ah-cam.h*s)/2-cam.y*s;}
const GR=n=>Math.max(n,22/Math.max(view.s,.05));
addEventListener('resize',resize);resize();

// ───────────────────────── math
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const ease=t=>1-Math.pow(1-clamp(t,0,1),3),easeIO=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const P=(x,y)=>({x,y});
function segInt(p1,p2,p3,p4){const d=(p2.x-p1.x)*(p4.y-p3.y)-(p2.y-p1.y)*(p4.x-p3.x);if(Math.abs(d)<1e-9)return null;const t=((p3.x-p1.x)*(p4.y-p3.y)-(p3.y-p1.y)*(p4.x-p3.x))/d;const u=((p3.x-p1.x)*(p2.y-p1.y)-(p3.y-p1.y)*(p2.x-p1.x))/d;if(t>=0&&t<=1&&u>=0&&u<=1){const ax=p2.x-p1.x,ay=p2.y-p1.y,bx=p4.x-p3.x,by=p4.y-p3.y;return{t,u,x:p1.x+t*ax,y:p1.y+t*ay,cross:ax*by-ay*bx,dot:ax*bx+ay*by};}return null;}
function distSeg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1;const t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/l,0,1);return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy);}
function distPoly(p,pts){let m=1e9;for(let i=0;i<pts.length-1;i++)m=Math.min(m,distSeg(p,pts[i],pts[i+1]));return m;}
function quad(a,c,b,t){const u=1-t;return P(u*u*a.x+2*u*t*c.x+t*t*b.x,u*u*a.y+2*u*t*c.y+t*t*b.y);}
function sampleQuad(a,c,b,n){const r=[];for(let i=0;i<=n;i++)r.push(quad(a,c,b,i/n));return r;}
function inPoly(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)c=!c;}return c;}
function centroid(poly){let x=0,y=0;poly.forEach(p=>{x+=p.x;y+=p.y});return P(x/poly.length,y/poly.length);}
function rot(p,a){const c=Math.cos(a),s=Math.sin(a);return P(p.x*c-p.y*s,p.x*s+p.y*c);}
function hex2rgb(h){if(h.startsWith('rgb'))return h.match(/[\d.]+/g).slice(0,3).map(Number);h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function shade(h,t){const c=hex2rgb(h),to=t<0?0:255,k=Math.abs(t);return`rgb(${c.map(v=>Math.round(v+(to-v)*k)).join(',')})`;}
function rgba(h,a){const c=hex2rgb(h);return`rgba(${c.join(',')},${a})`;}

// ───────────────────────── audio
let AC=null;
function ac(){if(!state.sound)return null;if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC.state==='suspended')AC.resume();return AC;}
function noiseBuf(a){const b=a.createBuffer(1,a.sampleRate*.12,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);return b;}
let NB=null;
function snip(v=.5){const a=ac();if(!a)return;NB=NB||noiseBuf(a);const s=a.createBufferSource();s.buffer=NB;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=3200+Math.random()*1800;f.Q.value=1.4;const g=a.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(a.destination);s.start();}
function tone(fr=880,d=.06,v=.08,type='triangle',delay=0){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(fr,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
const tick=()=>tone(1400+Math.random()*200,.04,.05);
const pop=()=>{tone(520,.08,.07,'sine');tone(780,.06,.04,'sine',.03)};
const bad=()=>{tone(210,.14,.07,'sine');tone(170,.16,.05,'sine',.06)};
const chime=()=>{[660,880,1320].forEach((f,i)=>tone(f,.4,.06,'sine',i*.09))};
function sndIcon(){$snd.innerHTML=state.sound?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>':'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';}
$snd.onclick=()=>{state.sound=!state.sound;save();sndIcon();};sndIcon();

// ───────────────────────── drawing helpers
const k=()=>DPR*view.s;
function shadow(b,oy,a){ctx.shadowColor=`rgba(45,32,20,${a})`;ctx.shadowBlur=b*k();ctx.shadowOffsetY=oy*k();ctx.shadowOffsetX=0;}
function noShadow(){ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;}
function path(pts,close=true){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));if(close)ctx.closePath();}
function smooth(pts){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);if(pts.length<3){pts.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));return;}for(let i=1;i<pts.length-1;i++){const m=P((pts[i].x+pts[i+1].x)/2,(pts[i].y+pts[i+1].y)/2);ctx.quadraticCurveTo(pts[i].x,pts[i].y,m.x,m.y);}const l=pts[pts.length-1];ctx.lineTo(l.x,l.y);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);}
function font(sz,w=600){ctx.font=`${w} ${sz}px "Inter Tight",system-ui,sans-serif`;}
function cable(pts,color,w=4.5,alpha=1){if(pts.length<2)return;ctx.save();ctx.globalAlpha=alpha;ctx.lineCap='round';ctx.lineJoin='round';smooth(pts);shadow(5,3,.2*alpha);ctx.strokeStyle=shade(color,-.3);ctx.lineWidth=w;ctx.stroke();noShadow();smooth(pts);ctx.strokeStyle=color;ctx.lineWidth=w*.62;ctx.stroke();ctx.translate(0,-w*.16);smooth(pts);ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=w*.2;ctx.stroke();ctx.restore();}
// noise texture for bg / metal
const noiseCv=document.createElement('canvas');noiseCv.width=noiseCv.height=160;{const g=noiseCv.getContext('2d'),d=g.createImageData(160,160);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=10;}g.putImageData(d,0,0);}
let noisePat=null;
const brushCv=document.createElement('canvas');brushCv.width=1000;brushCv.height=60;{const g=brushCv.getContext('2d');for(let i=0;i<900;i++){g.fillStyle=`rgba(${Math.random()<.5?'255,255,255':'0,0,0'},${Math.random()*.05})`;const x=Math.random()*1000,y=Math.random()*60,w=40+Math.random()*160;g.fillRect(x,y,w,.7);if(x+w>1000)g.fillRect(x-1000,y,w,.7);}}
let brushPat=null;
const weaveCache={};
function weave(hex){if(weaveCache[hex])return weaveCache[hex];const c=document.createElement('canvas');c.width=c.height=36;const g=c.getContext('2d');g.fillStyle=hex;g.fillRect(0,0,36,36);const cc=hex2rgb(hex),lt=(.299*cc[0]+.587*cc[1]+.114*cc[2])/255>.7?.35:1;for(let i=0;i<36;i+=2){g.fillStyle=`rgba(255,255,255,${.03+Math.random()*.06})`;g.fillRect(0,i,36,1);g.fillStyle=`rgba(0,0,0,${(.03+Math.random()*.06)*lt})`;g.fillRect(i,0,1,36);}for(let i=0;i<40;i++){g.fillStyle=`rgba(${Math.random()<.5?'255,255,255':'0,0,0'},.08)`;g.fillRect(Math.random()*36,Math.random()*36,1.4,1);}const p=ctx.createPattern(c,'repeat');weaveCache[hex]=p;return p;}
function cloth(poly,hex,o={}){const th=o.thick??3;ctx.save();ctx.globalAlpha=o.alpha??1;if(o.shadow!==false){path(poly);shadow(o.sb??18,o.so??9,.2);ctx.fillStyle=shade(hex,-.3);ctx.fill();noShadow();}if(th){ctx.save();ctx.translate(0,th);path(poly);ctx.fillStyle=shade(hex,-.32);ctx.fill();ctx.restore();}path(poly);ctx.fillStyle=weave(hex);ctx.fill();ctx.restore();}
function metal(x,y,w,h,r,o={}){ctx.save();rr(x,y,w,h,r);shadow(o.sb??16,o.so??8,o.sa??.26);const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#f6f6f5');g.addColorStop(1,'#d3d3d1');ctx.fillStyle=g;ctx.fill();noShadow();brushPat=brushPat||ctx.createPattern(brushCv,'repeat');ctx.save();rr(x,y,w,h,r);ctx.clip();ctx.fillStyle=brushPat;ctx.fillRect(x,y,w,h);ctx.restore();rr(x+.5,y+.5,w-1,h-1,r);ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1;ctx.stroke();rr(x,y,w,h,r);ctx.strokeStyle='rgba(0,0,0,.07)';ctx.stroke();ctx.restore();}
function dot(p,r,fill,stroke,lw=2){ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function handle(p,on){ctx.save();shadow(5,2,.25);dot(p,on?8:7,CORAL);noShadow();dot(p,on?8:7,null,'#fff',2.4);ctx.restore();}
function midHandle(p){ctx.save();shadow(4,2,.2);dot(p,6.5,'#fff');noShadow();dot(p,6.5,null,CORAL,2.2);ctx.restore();}
function dashed(pts,color=CORAL,w=2,dash=[7,6]){ctx.save();ctx.setLineDash(dash);ctx.lineCap='round';path(pts,false);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke();ctx.restore();}
function chalk(pts,w=2,col='rgba(255,255,255,.88)'){ctx.save();ctx.setLineDash([5,4]);ctx.lineCap='round';path(pts,false);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();ctx.restore();}
function pillText(x,y,text,bg='#fff',fg=INK,sz=13){font(sz,600);const w=ctx.measureText(text).width+16;ctx.save();shadow(6,2,.15);rr(x-w/2,y-12,w,24,12);ctx.fillStyle=bg;ctx.fill();noShadow();ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,x,y+.5);ctx.restore();}
function ring(p,t,r=14,color=CORAL){const a=(t*1.4)%1;ctx.save();ctx.globalAlpha=1-a;dot(p,r*.6+r*a,null,color,2.2);ctx.restore();ctx.save();ctx.globalAlpha=.9;dot(p,4,color);ctx.restore();}
function drawNeedle(T,ang,len=150,alpha=1,wd=1){const d=P(Math.cos(ang),Math.sin(ang)),n=P(-d.y*wd,d.x*wd);const E=P(T.x+d.x*len,T.y+d.y*len),M=P(T.x+d.x*len*.4,T.y+d.y*len*.4);ctx.save();ctx.globalAlpha=alpha;shadow(6,4,.28*alpha);ctx.beginPath();ctx.moveTo(T.x,T.y);ctx.lineTo(M.x+n.x*2.5,M.y+n.y*2.5);ctx.lineTo(E.x+n.x*3.4,E.y+n.y*3.4);ctx.arc(E.x,E.y,3.4*wd,ang+Math.PI/2,ang-Math.PI/2,true);ctx.lineTo(M.x-n.x*2.5,M.y-n.y*2.5);ctx.closePath();const g=ctx.createLinearGradient(M.x+n.x*4,M.y+n.y*4,M.x-n.x*4,M.y-n.y*4);g.addColorStop(0,'#fbfbfb');g.addColorStop(.45,'#c9cacd');g.addColorStop(1,'#85868b');ctx.fillStyle=g;ctx.fill();noShadow();const Ec=P(E.x-d.x*9*wd,E.y-d.y*9*wd);ctx.beginPath();ctx.moveTo(Ec.x-d.x*5*wd,Ec.y-d.y*5*wd);ctx.lineTo(Ec.x+d.x*4*wd,Ec.y+d.y*4*wd);ctx.lineCap='round';ctx.lineWidth=2.1*wd;ctx.strokeStyle='rgba(50,48,58,.6)';ctx.stroke();ctx.restore();return Ec;}

// ───────────────────────── rope (verlet cable)
class Rope{
  constructor(a,b,n,len,o={}){this.nodes=[];this.n=n;this.seg=len/(n-1);this.g=o.g??0;this.damp=o.damp??.92;this.color=o.color||THREAD;this.w=o.w||4.5;const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;for(let i=0;i<n;i++){const t=i/(n-1),wv=(o.wave||0)*Math.sin(t*Math.PI*(o.waves||3));const x=a.x+dx*t+nx*wv,y=a.y+dy*t+ny*wv;this.nodes.push({x,y,px:x,py:y,pin:false});}}
  static from(pts,o={}){const r=Object.create(Rope.prototype);r.nodes=pts.map(p=>({x:p.x,y:p.y,px:p.x,py:p.y,pin:false}));r.n=r.nodes.length;let L=0;for(let i=1;i<r.n;i++)L+=dist(r.nodes[i],r.nodes[i-1]);r.seg=L/Math.max(1,r.n-1);r.g=o.g??0;r.damp=o.damp??.9;r.color=o.color||THREAD;r.w=o.w||4.5;return r;}
  get last(){return this.nodes[this.n-1];}
  get length(){return this.seg*(this.n-1);}
  step(){const N=this.nodes;for(const p of N){if(p.pin){p.px=p.x;p.py=p.y;continue;}const vx=(p.x-p.px)*this.damp,vy=(p.y-p.py)*this.damp;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+this.g;}
    for(let k=0;k<16;k++)for(let i=0;i<this.n-1;i++){const a=N[i],b=N[i+1];if(a.pin&&b.pin)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1e-6,df=(d-this.seg)/d;const wa=a.pin?0:b.pin?1:.5,wb=b.pin?0:a.pin?1:.5;a.x+=dx*df*wa;a.y+=dy*df*wa;b.x-=dx*df*wb;b.y-=dy*df*wb;}}
  draw(alpha=1){cable(this.nodes,this.color,this.w,alpha);}
}

// ───────────────────────── scissors cutter (Pondo-style)
class Cutter{
  constructor(pts,onDone,onProg,speed=360){this.pts=pts;this.cum=[0];for(let i=1;i<pts.length;i++)this.cum.push(this.cum[i-1]+dist(pts[i],pts[i-1]));this.L=this.cum[this.cum.length-1]||1;this.d=0;this.onDone=onDone;this.onProg=onProg;this.speed=speed;this.next=0;this.hold=.25;}
  update(dt){if(this.d<this.L){this.d=Math.min(this.L,this.d+this.speed*dt);if(this.d>=this.next){snip();this.next+=30;}this.onProg&&this.onProg(this.d);}else{this.hold-=dt;if(this.hold<=0&&!this.called){this.called=true;this.onDone&&this.onDone();}}}
  at(d){let i=1;while(i<this.cum.length-1&&this.cum[i]<d)i++;const a=this.pts[i-1],b=this.pts[i],sg=(this.cum[i]-this.cum[i-1])||1,t=clamp((d-this.cum[i-1])/sg,0,1);return{x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),ang:Math.atan2(b.y-a.y,b.x-a.x)};}
  done(){return this.called;}
  drawSlit(){const pts=[];for(let i=0;i<this.pts.length;i++)if(this.cum[i]<=this.d)pts.push(this.pts[i]);pts.push(this.at(this.d));if(pts.length>1)slit(pts);}
  drawTool(){const p=this.at(this.d);const open=this.d>=this.L?.05:.1+.42*Math.abs(Math.sin(this.d/30*Math.PI));ctx.save();ctx.globalAlpha=this.d>=this.L?clamp(this.hold*4,0,1):1;drawScissors(p.x,p.y,p.ang,open);ctx.restore();}
}

// ───────────────────────── fx: floaters & confetti
const floats=[],bits=[];
function float(x,y,text,color=INK){floats.push({x,y,text,color,t:0});}
function burst(x,y,n=36){const cols=[CORAL,THREAD,TAPE,'#7a3fd1','#3f9b6b'];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*6;bits.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],t:0,l:10+Math.random()*10});}}
function updFx(dt){floats.forEach(f=>{f.t+=dt;f.y-=22*dt;});for(let i=floats.length-1;i>=0;i--)if(floats[i].t>1.8)floats.splice(i,1);bits.forEach(b=>{b.t+=dt;b.vy+=.22;b.vx*=.985;b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;});for(let i=bits.length-1;i>=0;i--)if(bits[i].t>2.4)bits.splice(i,1);}
function drawFx(){bits.forEach(b=>{ctx.save();ctx.globalAlpha=clamp(2.4-b.t,0,1);ctx.translate(b.x,b.y);ctx.rotate(b.r);ctx.strokeStyle=b.c;ctx.lineWidth=3.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-b.l/2,0);ctx.lineTo(b.l/2,0);ctx.stroke();ctx.restore();});floats.forEach(f=>{ctx.save();ctx.globalAlpha=clamp(1.8-f.t,0,1)*clamp(f.t*6,0,1);pillText(f.x,f.y,f.text,'#fff',f.color);ctx.restore();});}

function chalkCol(hex){return lum(hex)>.6?'rgba(40,90,170,.75)':'rgba(255,255,255,.88)';}

// real-world tips shown after every step
const IRL_B=['Cut real thread about as long as your arm. Snip it at a slant or wet the tip before threading — and a needle threader costs pennies.','Practise on a scrap of cotton first. Load 3 or 4 stitches onto the needle before pulling it through: it’s faster and straighter.','Use this for every seam. On real fabric keep stitches 3–5 mm, and pull them snug but not tight, or the seam will pucker.','Measure over thin clothes with the tape level all the way round. Ask a friend to check the back, and write the numbers down.','Use doubled thread. Lay a matchstick or pin across the button while you stitch, then pull it out and wrap the shank.','Sewing a zip by hand is easier than by machine. Tack it in place first, then use tiny backstitches 6–8 mm from the teeth.'];
const IRL=[[/grain/i,'Pin every 10–15 cm, inside the seam allowance, or weigh the paper down with tins. Measure from both ends of the grain arrow to the fold — the two numbers must match.'],
 [/^Cut/i,'Keep the fabric flat and use long, smooth strokes with the lower blade on the table. Mark notches with a tiny 3 mm snip.'],
 [/seam/i,'Pin with the heads towards you, stitch 1.5 cm from the edge, and press each seam before another one crosses it. Overcast the raw edges so they don’t fray.'],
 [/Hem/i,'Press the folds first, pin every 5 cm and try the garment on before you stitch — the hem is the easiest place to fix the length.'],
 [/Gather/i,'Use strong thread for the gathering rows and leave 10 cm tails. Pin the side seams and centres together first, then spread the gathers between them.'],
 [/dart/i,'Chalk the dart on the wrong side, fold through its middle, pin, and stitch from the wide end to the point. Tie a knot at the tip instead of backstitching.'],
 [/sleeve/i,'Match the shoulder dot and the notches first, then pin in between. Sew with the sleeve on top so you can smooth out small puckers.'],
 [/Buttonhole/i,'Practise on a doubled scrap first. Put a pin across the end of the buttonhole before cutting so the scissors can’t overshoot.'],
 [/Button/i,'Close the garment and push a pin through each buttonhole to mark exactly where its button goes.'],
 [/pocket/i,'Press the pocket edges under before pinning, and use a ruler so both pockets sit at the same height and angle.'],
 [/fell/i,'Trim to an even 6 mm so the fold is easy. Press the fold flat and pin it before topstitching.'],
 [/zip|fly/i,'Tack the zip in place with big stitches first so it can’t shift, then stitch, then pull the tacking out.'],
 [/Interfacing/i,'Test fusible interfacing on a scrap. Use a press cloth, press — don’t slide — and let it cool before you move it.'],
 [/lapel|crease/i,'Steam it, then let it cool flat before moving: cooling is what sets the shape. A damp tea towel makes a fine press cloth.'],
 [/Elastic/i,'Pin the far end of the elastic to the casing so it can’t disappear inside, and try the trousers on before joining the ends.'],
 [/Waistband/i,'Pressing the waistband before attaching it makes the inside neat and easy to sew.']];

 sari:{n:'Sari (blouse & petticoat)',base:'darted',intro:'The sari itself is 5–6 m of unstitched cloth — you only hem it. The blouse (choli) and petticoat are sewn. Start from the fitted dress for the blouse.',steps:(m,v)=>[

function photoModal(){let url=null,blob=null,res=null,c=null;

        <div style="margin:12px 0 2px;font-size:12.5px;color:var(--muted)">Traditional or cultural garment? <span style="color:var(--ink)">Pick it here — the AI can’t name these reliably.</span></div><select id="psty" style="width:100%;font:600 14px inherit;font-family:inherit;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:#fff"><option value="">No — a general style</option>${Object.entries(ADAPT).map(([k,a])=>`<option value="${k}" ${c.style===k?'selected':''}>${a.n}</option>`).join('')}</select>

// ───────── pattern & grain
function LayoutScene(id,key){const pc=DR()[id][key],F=fabricLayout(pc),k=F.k,poly=pc.poly,c=centroid(poly),bb=pc.bb;const target=F.toW(c);const pw=bb.w*k;

  return{enter(){ui({kicker:KICK(),title:'Choose your <em>fabric</em>.',msg:projOf(id).fab==='denim'?'Denim is a tough twill weave. Wash it twice before cutting — it shrinks a lot.':projOf(id).fab==='bottoms'?'Linen, cotton twill or viscose all drape nicely for wide legs. Wash and iron it first.':projOf(id).fab==='skirt'?'A medium-weight fabric with some body — cotton twill, wool or denim. Avoid stretchy fabric for your first skirt.':projOf(id).fab==='suit'?'Wool, linen or a firm cotton all tailor well. Steam-press it first so it won’t shrink under the iron later.':'Woven cotton or linen is easiest — it doesn’t slip or stretch. Old bedsheets work well. Wash and iron it first so it won’t shrink later.',extra:swatches(id),b1:{label:'Use this fabric',fn:()=>{phase='place';uiPlace();}}});},
    bounds(){return phase==='pick'?{x:F.fx-40,y:F.fy-30,w:F.fw+80,h:F.fh+60}:{x:F.fx-40,y:0,w:Math.max(F.fw+80,startX+pw*.65-F.fx+40),h:H};},
    update(dt){t+=dt;if(phase==='place'&&!drag){if(Math.abs(ang)<.07&&Math.abs(pos.x-target.x)<GR(14)&&Math.abs(pos.y-target.y)<130){ang=lerp(ang,0,.25);pos=P(lerp(pos.x,target.x,.25),lerp(pos.y,target.y,.25));if(Math.abs(ang)<.002&&dist(pos,target)<.6){ang=0;pos=P(target.x,target.y);phase='pinned';pinsT=0;pop();setTimeout(()=>DONE('The grain arrow follows the lengthwise threads — the strongest direction — so the garment hangs straight instead of twisting. Next: trace around it with chalk (or a sliver of soap) and cut.','Pinned on the <em>straight grain</em>.'),900);}}}if(pinsT>=0)pinsT+=dt;},
    get dbg(){return{knob:knob(),pos,target,ang};},
    down(p){if(phase!=='place')return;if(dist(p,knob())<GR(20)){drag='rot';return;}if(inPoly(p,poly.map(toWorld))){drag='move';off=P(pos.x-p.x,pos.y-p.y);}},
    move(p){if(drag==='move')pos=P(p.x+off.x,p.y+off.y);else if(drag==='rot'){ang=Math.atan2(p.y-pos.y,p.x-pos.x)+Math.PI/2;if(ang>Math.PI)ang-=Math.PI*2;}},
    up(){if(!drag)return;drag=null;const a=Math.abs(ang)*180/Math.PI;if(phase==='place'){if(a>4)setMsg(`The grain arrow is <b>${a.toFixed(0)}°</b> off. Turn the knob until it runs straight down, parallel to the fold.`);else if(Math.abs(pos.x-target.x)>=GR(14))setMsg(pc.onFold?'Grain looks straight. Now slide the <b>place-on-fold</b> bracket right against the fold.':'Grain looks straight. Slide it so it sits about <b>3 cm</b> from the fold — the glowing outline shows the spot.');}},
    hover(p){if(phase==='place')cv.style.cursor=dist(p,knob())<GR(20)?'grab':inPoly(p,poly.map(toWorld))?'move':'default';},
    draw(){const hex=fabOf(id);drawFolded(F,hex);if(phase==='pick')return;
      if(!pc.onFold&&phase==='place'){ctx.save();ctx.globalAlpha=.3+.2*Math.sin(t*3);ctx.setLineDash([5,5]);ctx.strokeStyle=chalkCol(hex);ctx.lineWidth=1.5;path(poly.map(F.toW));ctx.stroke();ctx.restore();}
      const wp=poly.map(toWorld);ctx.save();path(wp);shadow(10,6,.2);ctx.fillStyle='rgba(248,244,236,.93)';ctx.fill();noShadow();ctx.strokeStyle='rgba(29,32,39,.55)';ctx.lineWidth=1.2;ctx.stroke();ctx.restore();
      const fs=clamp(bb.h*.032,1.6,3);ctx.save();ctx.translate(pos.x,pos.y);ctx.rotate(ang);ctx.scale(k,k);ctx.translate(-c.x,-c.y);ctx.lineWidth=.3;ctx.strokeStyle='#2c2f37';ctx.fillStyle='#2c2f37';
      const gx=c.x+1.5,gy0=bb.y0+bb.h*.25,gy1=bb.y1-bb.h*.14;ctx.beginPath();ctx.moveTo(gx,gy0);ctx.lineTo(gx,gy1);ctx.stroke();[[gy0,1],[gy1,-1]].forEach(([y,s])=>{ctx.beginPath();ctx.moveTo(gx,y);ctx.lineTo(gx-1.2,y+s*2.8);ctx.lineTo(gx+1.2,y+s*2.8);ctx.closePath();ctx.fill();});
      ctx.save();ctx.translate(gx-1.3,(gy0+gy1)/2);ctx.rotate(-Math.PI/2);ctx.font=`600 ${fs*.7}px "Inter Tight",sans-serif`;ctx.textAlign='center';ctx.fillText('GRAINLINE',0,0);ctx.restore();
      if(pc.onFold){const by0=bb.y0+bb.h*.12,by1=bb.y1-bb.h*.1;ctx.beginPath();ctx.moveTo(.5,by0);ctx.lineTo(2.6,by0);ctx.lineTo(2.6,by1);ctx.lineTo(.5,by1);ctx.stroke();[by0,by1].forEach(y=>{ctx.beginPath();ctx.moveTo(.4,y);ctx.lineTo(1.7,y-1);ctx.lineTo(1.7,y+1);ctx.closePath();ctx.fill();});ctx.save();ctx.translate(4.2,(by0+by1)/2);ctx.rotate(-Math.PI/2);ctx.font=`600 ${fs*.65}px "Inter Tight",sans-serif`;ctx.textAlign='center';ctx.fillText('PLACE ON FOLD',0,0);ctx.restore();}
      const tx=c.x+3,ty=bb.y0+bb.h*.22;ctx.font=`700 ${fs}px "Inter Tight",sans-serif`;ctx.textAlign='left';ctx.fillText(pc.name.toUpperCase(),tx,ty);ctx.font=`500 ${fs*.6}px "Inter Tight",sans-serif`;ctx.fillText(pc.cut.split(' (')[0],tx,ty+fs*.9);ctx.restore();
      if(phase==='place'){const kn=knob(),tp=toWorld(P(c.x,bb.y0-1));ctx.save();ctx.strokeStyle='rgba(29,32,39,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(tp.x,tp.y);ctx.lineTo(kn.x,kn.y);ctx.stroke();ctx.restore();metal(kn.x-14,kn.y-14,28,28,14,{sb:8,so:4});dot(kn,4,CORAL);if(!drag&&t<8)ring(kn,t,16);
        const a=Math.abs(ang)*180/Math.PI;pillText(kn.x+50,kn.y,a<.5?'0°':`${a.toFixed(0)}°`,'#fff',a<4?'#2f7d55':CORAL,12);

// ───────── cutting (Pondo-style scissors)
function CutScene(id,key){const pc=DR()[id][key],F=fabricLayout(pc),k=F.k,E=pc.edges;let ei=0,start=F.toW(E[0].a),end=null,mid=null,midMoved=false,drag=null,cutter=null,phase='cut',t=0,scrapT=-1,rev=-1,center=0;const cuts=[],first=start;

  const midPt=()=>mid||P((start.x+end.x)/2,(start.y+end.y)/2);
  const userPts=()=>{if(!end)return[];const m=midPt();const cc=P(2*m.x-(start.x+end.x)/2,2*m.y-(start.y+end.y)/2);return sampleQuad(start,cc,end,26);};

  function evaluate(){const up=userPts(),tg=tgt(E[ei]);let s=0;up.forEach(p=>s+=distPoly(p,tg));return{mean:s/up.length/k,endErr:dist(end,tg[tg.length-1])/k,up};}
  function doCut(){if(!end||cutter)return;const ev=evaluate();if(ev.endErr>1.3){bad();const nx=E[ei+1];setMsg(`Your cut doesn’t stop at the end of the <b>${E[ei].name}</b> — it’s <b>${ev.endErr.toFixed(1)} cm</b> from the glowing end dot.${nx?` The ${nx.name} is cut next, as a separate step.`:''}`);return;}if(ev.mean>.75){bad();setMsg(E[ei].kind==='curve'?`The ends are right, but the cut is about <b>${ev.mean.toFixed(1)} cm</b> off the curve. Drag the <b>middle handle</b> to bend it onto the chalk line.`:`About <b>${ev.mean.toFixed(1)} cm</b> off the chalk line. Move the handles onto it. Measure twice, cut once!`);return;}

  function finish(){phase='scrap';scrapT=0;state.cuts[id+'.'+key]=piecePoly().map(F.toCm).map(p=>P(+p.x.toFixed(2),+p.y.toFixed(2)));save();ui({kicker:KICK(),title:'Lift away the <em>scraps</em>.',msg:'Keep the scraps — they’re perfect for practising stitches.'});}

    get dbg(){return{start,ei,tg:ei<E.length?tgt(E[ei]):null};},
    bounds(){const y=F.fy-25,h=F.fh+50;if(rev<0)return{x:F.fx-40,y,w:F.fw+80,h};if(pc.onFold){const hw=(F.toW(P(pc.bb.x1,0)).x-F.fx);return{x:500-hw-40,y,w:hw*2+80,h};}const b=pb();return{x:b.x0-40,y,w:b.w*2+110,h};},
    update(dt){t+=dt;if(cutter)cutter.update(dt);if(scrapT>=0&&scrapT<1){scrapT=Math.min(1,scrapT+dt*.9);if(scrapT>=1){rev=0;snip(.4);}}

    hover(p){cv.style.cursor=end&&(dist(p,end)<GR(18)||dist(p,midPt())<GR(16))?'grab':'crosshair';},
    draw(){const hex=fabOf(id),r=F.rect;
      if(phase==='cut'){drawFolded(F,hex);E.forEach((e,i)=>{if(i>ei){ctx.save();ctx.globalAlpha=.35;chalk(tgt(e),2,chalkCol(hex));ctx.restore();}else if(i===ei)chalk(tgt(e),2.6,chalkCol(hex));});cuts.forEach(c=>{slit(c);ctx.save();ctx.globalAlpha=.5;path(c,false);ctx.strokeStyle=lum(hex)>.5?'rgba(0,0,0,.35)':'rgba(255,255,255,.4)';ctx.lineWidth=1;ctx.stroke();ctx.restore();});if(cutter)cutter.drawSlit();

// ───────── seams (stack, sew, repeat, press)
function SeamsScene(id){const D=DR()[id],pc=D.front,PJ=projOf(id),SX=PJ.seam||{a:'shoulder seam',edge:'SHOULDER EDGE ↑',rest:'Repeat along the second shoulder and both side seams.',btn:'Sew the shoulder →'};const T=PJ.splay?(p=>p.y>pc.rise?P(p.x+(p.y-pc.rise)*PJ.splay,p.y):p):(p=>p);const polys=pc.onFold?fullPolys(id,'front'):(()=>{const h=cutPoly(id,'front').map(T);return[h.map(mxP),h];})();const bb=bbox(polys.flat());const kk=Math.min(5.4,520/bb.h,330/bb.w);const top=(H-bb.h*kk)/2-bb.y0*kk;
  const toS=(p,cx)=>P(cx+p.x*kk,top+p.y*kk);let phase='stack',t=0,flipT=-1,cT=0,st=null,ffT=-1,iron=null;
  const seamsCm=[];pc.seams.forEach(nm=>{const e=pc.edges.find(e=>e.name===nm);const s=insetEdge(e,pc.poly).map(T);seamsCm.push(s,s.map(mxP));});
  const seams=cx=>seamsCm.map(s=>s.map(p=>toS(p,cx)));const hw=Math.max(-bb.x0,bb.x1)*kk;
